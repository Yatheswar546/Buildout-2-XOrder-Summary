<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Summary</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="main">
        <div class="container">
            <img
                class="hero-image"
                src="images/illustration-hero.svg"
                alt="A person enjoying music with headphones"
            >

            <section class="content">
                <h1 class="heading">Order Summary</h1>

                <p class="summary-para">You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like!</p>

                <div class="plan">
                    <img
                        class="music-icon"
                        src="images/icon-music.svg"
                        alt=""
                    >

                    <div class="plan-text">
                        <h3>Annual Plan</h3>
                        <p>$59.99/year</p>
                    </div>

                    <div class="change-link">
                        <a href="#">Change</a>
                    </div>
                </div>

                <button class="proceed-btn" type="button">
                    Proceed to Payment
                </button>

                <a class="cancel-order" href="#">Cancel Order</a>
            </section>
        </div>

        <footer class="footer">
            Challenge by
            <a href="https://www.crio.do" target="_blank" rel="noopener noreferrer">Crio.do</a>.
            Coded by
            <a href="https://www.github.com/Yatheswar546" target="_blank" rel="noopener noreferrer">Yatheswar</a>.
        </footer>
    </main>
</body>
</html>
